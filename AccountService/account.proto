syntax = "proto3";

option csharp_namespace = "AccountService";

import "google/protobuf/empty.proto";

// User id comes from the JWT, not the request.
service Accounts {
  rpc Get (google.protobuf.Empty) returns (Account);
  rpc Update (UpdateAccountRequest) returns (Account);
}

message UpdateAccountRequest {
  string name = 1;
  string email = 2;
}

message Account {
  string id = 1;
  string name = 2;
  string email = 3;
}
